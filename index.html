            <iframe src='https://iframe.chat/embed?chat=31318985' id='chattable' frameborder='none'></iframe>
                <script>
                    chattable.initialize({
                        stylesheet : "chattable.css"
                        
                    });

                    const onlineUsersElement = document.getElementById("online-users");
                    const onlineCount = document.getElementById("online-count");

                    let isExpanded = false;

                    onlineCount.addEventListener("click", () => {
                    isExpanded = !isExpanded;
                    onlineUsersElement.style.display = isExpanded ? "block" : "none";
                    });

                    chattable.on("connection", function (list) {
                    onlineUsersElement.innerHTML = "";

                    let userList = Object.values(list);

                    userList.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                    onlineCount.textContent = `(${userList.length})`;

                    userList.forEach((name) => {
                        const item = document.createElement("li");
                        item.textContent = name;
                        item.classList.add("list-item");
                        onlineUsersElement.appendChild(item);
                        });
                    });
                </script>
